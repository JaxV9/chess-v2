@if(!chessFacade.gameIsStarted()){
<div class="container">
    <div class="menu">
        <h2>Menu</h2>
        <div class="menu-navigation">
            @if (isMenuLoading()) {
                <mat-spinner diameter="50" />
            } @else {
                @if (!isGuestOrLogged()) {
                    @if (!haveGameSession()) {
                        <span class="label">You should to play as a guest or login, before playing</span>
                    }
                    <button (click)="chessFacade.createGuest()">Play as a guest</button>
                }
                @if(isGuestOrLogged()) {
                    @if (!haveGameSession()) {
                            <button (click)="chessFacade.createGameSession()">Play online with another player</button>
                        <div class="code-container">
                            <input
                                type="text"
                                placeholder="Enter game code"
                                aria-label="Game session code"
                                [value]="sessionCode()"
                                (input)="onCodeChange($event)"
                                (keydown.enter)="joinGameSession()"
                                [disabled]="chessFacade.joinGameSessionLoading()"
                            >
                            <button
                                (click)="joinGameSession()"
                                [disabled]="!sessionCode().trim() || chessFacade.joinGameSessionLoading()"
                                aria-label="Join game session"
                            >
                                @if (chessFacade.joinGameSessionLoading()) {
                                    <span class="btn-spinner"></span>
                                } @else {
                                    Join
                                }
                            </button>
                        </div>
                    } @else {
                        <button (click)="chessFacade.resumeGame()">Resume game</button>
                        <button (click)="chessFacade.quitGame()">Quit game</button>
                    }
                    <button (click)="chessFacade.disconnectGuest()">Disconnect</button>
                }
            }
        </div>
    </div>
</div>
} @else {
    <button (click)="chessFacade.pauseGame()" class="settings-btn">
        <span class="material-icons">
            settings
        </span>
    </button>
}
